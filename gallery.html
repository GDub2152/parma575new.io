<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photos | Parma 575 GMRS Radio Group</title>
<meta name="description" content="Photos and event albums from the Parma 575 GMRS Radio Group.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/gallery.css">
</head>
<body>
<div id="site-header"></div>
<section class="page-hero gallery-hero">
  <h1>Photo Gallery</h1>
  <p>Club events, meetings, repeater projects, and community activities.</p>
</section>

<main class="section gallery-page">
  <div class="container">
    <div class="gallery-toolbar">
      <div>
        <h2>Albums</h2>
        <p id="gallerySummary" class="gallery-summary">Loading photos…</p>
      </div>
      <label class="gallery-search-wrap" for="gallerySearch">
        <span>Search albums</span>
        <input id="gallerySearch" type="search" placeholder="Example: picnic" autocomplete="off">
      </label>
    </div>

    <div id="galleryNotice" class="gallery-notice" hidden></div>
    <div id="albumGrid" class="album-grid" aria-live="polite"></div>
    <div id="photoView" class="photo-view" hidden>
      <button id="backToAlbums" class="btn btn-dark gallery-back" type="button">← Back to albums</button>
      <div class="album-heading">
        <div>
          <h2 id="albumTitle"></h2>
          <p id="albumCount" class="gallery-summary"></p>
        </div>
      </div>
      <div id="photoGrid" class="photo-grid"></div>
    </div>
  </div>
</main>

<div id="galleryLightbox" class="gallery-lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="lightbox-close" type="button" aria-label="Close photo viewer">×</button>
  <button class="lightbox-nav lightbox-prev" type="button" aria-label="Previous photo">‹</button>
  <figure>
    <img id="lightboxImage" alt="">
    <figcaption id="lightboxCaption"></figcaption>
  </figure>
  <button class="lightbox-nav lightbox-next" type="button" aria-label="Next photo">›</button>
</div>

<div id="site-footer"></div>
<script src="assets/js/components.js"></script>
<script src="assets/js/gallery.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
