name: Gallery Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: gallery-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out website
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Load OneDrive connection
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          if [ -z "$RCLONE_CONFIG_CONTENT" ]; then
            echo "Missing RCLONE_CONFIG repository secret."
            exit 1
          fi

          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_CONTENT" > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"

      - name: Verify OneDrive connection
        run: |
          rclone lsf "onedrive:Parma575 Website Photos"

           - name: Synchronize OneDrive albums
              run: |
          mkdir -p assets/gallery

          rclone sync \
            "onedrive:Parma575 Website Photos" \
            "assets/gallery" \
            --filter "+ **/*.jpg" \
            --filter "+ **/*.jpeg" \
            --filter "+ **/*.png" \
            --filter "+ **/*.webp" \
            --filter "+ **/*.gif" \
            --filter "+ **/*.avif" \
            --filter "- **" \
            --delete-excluded \
            --fast-list

      - name: Build gallery index
        run: |
          python3 scripts/build-gallery.py

      - name: Publish gallery changes
        run: |
          git config user.name "Parma575 Gallery Bot"
          git config user.email "actions@users.noreply.github.com"

          git add assets/gallery

          if git diff --cached --quiet; then
            echo "No gallery changes."
            exit 0
          fi

          git commit -m "Update OneDrive photo gallery"
          git pull --rebase origin main
          git push origin HEAD:main
