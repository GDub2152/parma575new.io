name: Gallery Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: gallery-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Load OneDrive connection
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          if [ -z "$RCLONE_CONFIG_B64" ]; then
            echo "Missing RCLONE_CONFIG_B64 repository secret. See ONEDRIVE-GALLERY-SETUP.md."
            exit 1
          fi
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_B64" | base64 --decode > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Synchronize OneDrive albums
        run: |
          mkdir -p assets/gallery
          rclone sync "parma575:Parma575 Website Photos" assets/gallery \
            --exclude "gallery-data.json" \
            --exclude "README.txt" \
            --include "*/" \
            --include "*.jpg" --include "*.jpeg" --include "*.png" \
            --include "*.webp" --include "*.gif" --include "*.avif" \
            --exclude "*" \
            --fast-list

      - name: Build gallery index
        run: python3 scripts/build-gallery.py

      - name: Publish gallery changes
        run: |
          git config user.name "Parma575 Gallery Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/gallery
          if git diff --cached --quiet; then
            echo "No gallery changes."
          else
            git commit -m "Update OneDrive photo gallery"
            git push
          fi
